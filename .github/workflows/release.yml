name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: chest_looting_game
            name: chest-looting-game-linux
            ext: ""
          - os: windows-latest
            artifact: chest_looting_game.exe
            name: chest-looting-game-windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare versioned binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/release/${{ matrix.artifact }} "release-assets/${{ matrix.name }}-${{ github.ref_name }}${{ matrix.ext }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          prerelease: true
